name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.12 omitted: scprep 1.2.3 pins pandas<2.1 and pandas 2.0.x ships no cp312
        # wheel, so `pip install` cannot succeed on 3.12 until scprep releases.
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install ./python pytest
      # run outside the checkout so `import magic` resolves the installed wheel, not the source tree
      - run: python -c "import magic; print(magic.__version__)"
        working-directory: ${{ runner.temp }}
      - run: pytest "$GITHUB_WORKSPACE/python/test/test_pj13_smoke.py"
        working-directory: ${{ runner.temp }}
